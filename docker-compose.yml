# A.E.G.I.S. // PostGIS-enabled PostgreSQL for local development.
# Credentials & DB name are kept in sync with .env (consumed by agent.py).
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aegis-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aegis_secret
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
      # init.sql runs only on first initialisation of an empty data volume
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aegis_pgdata:
