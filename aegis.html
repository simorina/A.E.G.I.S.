<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US DEFENSE // SAT-LINK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen w-screen overflow-hidden bg-black text-white">

    <div id="global-loader">
        <div class="loader"></div>
        <div class="loader-text">SETTING UP...</div>
    </div>

    <button onclick="toggleSidebar()" class="menu-toggle" aria-label="Toggle Menu">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <aside id="sidebar" class="sidebar closed">
        <div class="sidebar-inner">
            <!-- ZONA 1: identità + stato -->
            <header class="sidebar-header">
                <h1 class="brand">
                    A.E.G.I.S <span class="brand-version">v4.0</span>
                </h1>
                <p class="link-status">
                    <span class="status-dot" aria-hidden="true"></span>
                    ENCRYPTED CONNECTION
                </p>
            </header>

            <!-- ZONA 2: archivio conversazioni (collassabile) -->
            <section class="archive" aria-labelledby="archive-label">
                <div class="archive-bar">
                    <button id="archive-toggle" type="button" class="archive-toggle"
                            aria-expanded="false" aria-controls="archive-panel">
                        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                        <span id="archive-label" class="section-label">ARCHIVIO</span>
                        <span id="archive-count" class="archive-count">0</span>
                    </button>
                    <button id="clear-archive-btn" type="button" class="btn-icon is-danger"
                            aria-label="Svuota archivio conversazioni" title="Svuota archivio">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                            <path d="M10 11v6M14 11v6"></path>
                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                        </svg>
                    </button>
                    <button id="new-chat-btn" type="button" class="btn-new-chat" aria-label="Nuova conversazione">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>NUOVA</span>
                    </button>
                </div>
                <div id="archive-panel" class="archive-panel" hidden>
                    <div id="conversation-list" class="conversation-list scrollbar-custom"></div>
                </div>
            </section>

            <!-- ZONA 3: terminale (spazio dominante) -->
            <div class="terminal-label">
                <span class="section-label">TERMINALE</span>
                <span class="rule" aria-hidden="true"></span>
            </div>
            <div id="chat-history" class="chat-history scrollbar-custom">
                <div class="msg-system">
                    <strong>SYSTEM</strong> TERMINAL READY. AWAITING TARGET COORDINATES.
                </div>
            </div>

            <!-- ZONA 4: composer -->
            <div class="composer">
                <div id="attachment-bar" class="attachment-bar" hidden>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                    <span id="attachment-label" class="attachment-label">ATTACHED IMAGE READY</span>
                    <button type="button" id="clear-attachment-btn" class="btn-icon" aria-label="Rimuovi allegato">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="composer-field">
                    <button type="button" id="attach-image-btn" class="btn-icon composer-attach" aria-label="Allega immagine">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                    <label for="user-input" class="sr-only">Comando operatore</label>
                    <input type="text" id="user-input"
                           class="composer-input"
                           placeholder="Inserisci comando…"
                           autocomplete="off">
                    <button onclick="sendMessage()" class="btn-execute" aria-label="Esegui comando">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>

                <button onclick="performScan()" class="btn-scan">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="11" y1="7" x2="11" y2="15"></line>
                        <line x1="7" y1="11" x2="15" y2="11"></line>
                        <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
                    </svg>
                    RECON SCAN
                </button>
            </div>
        </div>
    </aside>

    <main class="fixed inset-0 z-1">
        <div id="map" class="h-full w-full"></div>
        
        <div class="overlay-vignette"></div>
        <div class="overlay-grid"></div>
        
        <div class="crosshair">
            <div class="crosshair-h"></div>
            <div class="crosshair-v"></div>
            <div class="crosshair-box"></div>
        </div>

        <div class="absolute bottom-10 right-10 z-[1000] font-mono text-[10px] text-amber-500/80 bg-black/80 border border-amber-500/30 p-4 backdrop-blur-sm pointer-events-none">
            <div class="flex justify-between gap-8">
                <span>LAT: <span id="lat-disp" class="text-white">--.----</span></span>
                <span>LNG: <span id="lng-disp" class="text-white">--.----</span></span>
            </div>
            <div class="mt-1 opacity-50">SIGNAL STRENGTH: 98%</div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const btn = document.querySelector('.menu-toggle');
            sb.classList.toggle('closed');
            btn.classList.toggle('active');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
