<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military Intelligence - Access Portal</title>
    <link rel="stylesheet" href="css/login-style.css">
</head>
<body>

    <section id="login-section">
        <div class="header">
            <h1 id="title-glitch" data-value="INTEL_CORE_v8.4">INTEL_CORE_v8.4</h1>
            <div class="sub-header">AUTHORIZED PERSONNEL ONLY // CLASS_A</div>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>Operator_ID</label>
                <input type="text" placeholder="CMD_USR_XXXX" autocomplete="off" id="input-id" required>
            </div>
            <div class="input-group">
                <label>Access_Key</label>
                <input type="password" placeholder="••••••••" autocomplete="off" id="input-key" required>
            </div>
            <button type="submit" id="btn-auth">Initialize_Session</button>
        </form>

        <div class="system-status">
            > CONNECTION: <span style="color:#fff">SECURE</span><br>
            > ENCRYPTION: AES-256-GCM<br>
            > UPLINK_STATUS: <span class="blink" id="status-text">WAITING FOR AUTH</span><br>
            > MEMORY_ADDR: <span id="mem-addr">0x4F2A</span><br>
            > MANUAL_CTRL: ACTIVE
        </div>
    </section>

    <div class="decor-line top"></div>
    <div class="decor-line bottom"></div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script src="js/3dmodels.js" type="module"></script>

    <script>
        // Gestione Random Hex
        setInterval(() => {
            const addr = document.getElementById('mem-addr');
            addr.innerText = '0x' + Math.floor(Math.random()*16777215).toString(16).toUpperCase().substring(0, 4);
        }, 150);

        // Gestione Login Reale
        const form = document.getElementById('login-form');
        const btn = document.getElementById('btn-auth');
        const statusText = document.getElementById('status-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI: Stato "Caricamento"
            const originalText = btn.innerText;
            btn.innerText = "VERIFYING CREDENTIALS...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            const operatorId = document.getElementById('input-id').value;
            const accessKey = document.getElementById('input-key').value;

            try {
                // Chiamata al server Python
                const response = await fetch('http://localhost:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        operator_id: operatorId, 
                        access_key: accessKey 
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // UI: Successo
                    btn.innerText = "ACCESS GRANTED // LEVEL " + data.clearance;
                    btn.style.backgroundColor = "#4ade80"; // Verde hacker
                    btn.style.color = "#000";
                    btn.style.borderColor = "#4ade80";
                    btn.style.boxShadow = "0 0 20px #4ade80";
                    
                    statusText.innerText = "ENCRYPTED TUNNEL OPEN";
                    statusText.style.color = "#4ade80";

                    // Redirect dopo 1.5 secondi
                    setTimeout(() => {
                        // Salva il token se vuoi usarlo nelle altre pagine
                        sessionStorage.setItem('intel_token', data.token);
                        // Reindirizza alla dashboard (crea questo file o cambia destinazione)
                        window.location.href = 'aegis.html'; 
                    }, 1500);

                } else {
                    throw new Error("Unauthorized");
                }

            } catch (error) {
                // UI: Errore
                console.error("Login failed:", error);
                
                btn.innerText = "ACCESS DENIED // INVALID KEY";
                btn.style.backgroundColor = "transparent";
                btn.style.color = "red";
                btn.style.borderColor = "red";
                btn.style.boxShadow = "0 0 15px red";
                
                // Shake effect (facoltativo, se vuoi aggiungere CSS)
                form.style.transform = "translateX(5px)";
                setTimeout(() => form.style.transform = "translateX(-5px)", 50);
                setTimeout(() => form.style.transform = "translateX(0)", 100);

                // Reset dopo 2 secondi
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = ""; // Torna al default CSS
                    btn.style.color = "";
                    btn.style.borderColor = "";
                    btn.style.boxShadow = "";
                    btn.disabled = false;
                }, 2000);
            }
        });
    </script>
</body>
</html>
